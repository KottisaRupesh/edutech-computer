<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTech Computer | Login</title>
    <!-- favicon -->
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Header CSS -->
    <link rel="stylesheet" href="header.css">
    <!-- Footer CSS -->
    <link rel="stylesheet" href="footer.css">
    <!-- Main Style CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Login Page CSS -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- ========== HEADER (loaded via JS) ========== -->
    <div id="header-placeholder"></div>

    <!-- =========================================
         LOGIN SECTION
         ========================================= -->
    <section class="login-section">

        <div class="container">
            <div class="row justify-content-center align-items-center login-row">
                <div class="col-lg-4 col-md-6 col-sm-10">

                    <div class="login-card">
                        <div class="login-card-header">
                            <div class="login-header-icon">
                                <i class="fas fa-user-lock"></i>
                            </div>
                            <div>
                                <h3 class="login-title">Student Login</h3>
                                <p class="login-subtitle">Enter your credentials to continue</p>
                            </div>
                        </div>

                        <div class="login-card-body">
                            <form id="loginForm" class="login-form" novalidate>

                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label">
                                        Email Address <span class="required">*</span>
                                    </label>
                                    <div class="input-icon-wrap">
                                        <i class="fas fa-envelope input-icon"></i>
                                        <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email" required autocomplete="email">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="loginPassword" class="form-label">
                                        Password <span class="required">*</span>
                                    </label>
                                    <div class="input-icon-wrap">
                                        <i class="fas fa-lock input-icon"></i>
                                        <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                                        <button type="button" class="btn-toggle-password" id="togglePassword" aria-label="Show password">
                                            <i class="fas fa-eye" id="togglePasswordIcon"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="login-options">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="rememberMe">
                                        <label class="form-check-label" for="rememberMe">
                                            Remember me
                                        </label>
                                    </div>
                                </div>

                                <div id="loginMsg" class="login-msg"></div>

                                <div class="d-grid mt-4">
                                    <button type="submit" class="btn-login-submit">
                                        <i class="fas fa-sign-in-alt me-2"></i>Login
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <!-- ========== FOOTER (loaded via JS) ========== -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main Script JS -->
    <script src="script.js"></script>
</body>
</html>
